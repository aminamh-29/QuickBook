{% extends "dashboard/base.html" %}
{% block title %}Staff login{% endblock %}
{% block content %}
<div class="card hero-card">
  <div class="d-flex justify-content-between small">
    <span><strong>QuickBook</strong><br><span class="text-muted">Event booking</span></span>
    <em class="text-muted">Let's create</em>
  </div>
  <form method="post" novalidate>
    {% csrf_token %}
    <h1 class="mb-4">Hello,<br>Admin.</h1>
    {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}
    <div class="mb-3">
      <label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" class="form-control" id="id_username" autofocus required>
    </div>
    <div class="mb-4">
      <label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" class="form-control" id="id_password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100 py-2">Sign in</button>
  </form>
</div>
{% endblock %}
