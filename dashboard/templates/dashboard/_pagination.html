{% if is_paginated %}
<nav aria-label="Pagination">
  <ul class="pagination justify-content-center flex-wrap">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a></li>
    {% else %}<li class="page-item disabled"><span class="page-link">Previous</span></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a></li>
    {% else %}<li class="page-item disabled"><span class="page-link">Next</span></li>{% endif %}
  </ul>
</nav>
{% endif %}
